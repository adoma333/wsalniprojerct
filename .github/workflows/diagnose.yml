name: Wasalni Live Check
# فحص الموقع المنشور في متصفح حقيقي: أخطاء الكونسول، الطلبات الفاشلة، ولقطات شاشة
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnose.yml', 'scripts/live-check.mjs']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SURGE_DOMAIN_RAW: ${{ secrets.SURGE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          npm i --no-save playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: موارد الخريطة
        run: |
          curl -s https://tiles.openfreemap.org/styles/liberty | python3 -c "import json,sys;d=json.load(sys.stdin);print('SPRITE',d.get('sprite'));print('GLYPHS',d.get('glyphs'));[print('POI',l['id'],json.dumps(l['layout'].get('icon-image'))[:300]) for l in d['layers'] if l.get('source-layer')=='poi'][:5];print('FONTS',set(f for l in d['layers'] for f in (l.get('layout',{}).get('text-font') or []) if isinstance(f,str)))"
          SP=$(curl -s https://tiles.openfreemap.org/styles/liberty | python3 -c "import json,sys;print(json.load(sys.stdin)['sprite'])")
          curl -s "$SP.json" | python3 -c "import json,sys;k=sorted(json.load(sys.stdin));print('ICONS',len(k),' '.join(k[:400]))"
      - name: الفحص
        run: |
          d="${SURGE_DOMAIN_RAW:-wsalni.surge.sh}"
          ONLY=live node scripts/live-check.mjs "https://$(echo $d | tr -d '[:space:]')"
      - name: فحص الخريطة من الكود الحالي
        run: |
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          (npx --yes serve@14 -l 5055 dist/site >/dev/null 2>&1 &)
          sleep 4
          ONLY=map DUMP=1 node scripts/live-check.mjs "http://localhost:5055"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-check, path: shots, retention-days: 3 }
